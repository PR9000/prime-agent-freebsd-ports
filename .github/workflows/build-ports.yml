name: FreeBSD Ports CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-freebsd:
    name: FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # FreeBSD Releases: testing 14.4 and 15.1 first (14.3 and 15.0 commented out for now)
        release: ["14.4", "15.1"]
        # release: ["14.3", "14.4", "15.0", "15.1"]
        arch: [x86_64, aarch64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FreeBSD Ports in VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          mem: 8192
          cache-after-prepare: true
          copyback: true
          prepare: |
            export IGNORE_OSVERSION=yes
            pkg update -f
            # Install gitup, SSL certificates, curl, and default system packages (no hardcoded versions)
            pkg install -y gitup ca_root_nss curl pkgconf cmake ninja libzmq4 node npm python3 ripgrep fd-find
          run: |
            set -e
            export IGNORE_OSVERSION=yes

            echo "===> FreeBSD System Info:"
            uname -a
            freebsd-version

            echo "===> Diagnosing installed packages (Python, Node, npm):"
            pkg info "python*" || true
            pkg info "py3*" || true
            pkg info "*node*" || true
            pkg info "*npm*" || true

            echo "===> Searching available packages in repository:"
            pkg search npm || true
            pkg search python || true
            pkg search py3 || true

            # 1. Fetch FreeBSD Ports tree via gitup
            echo "===> Updating /usr/ports with gitup..."
            if [ ! -d "/usr/ports/Mk" ]; then
              gitup ports
            fi

            # 2. Download and apply py-tyro patch (Bugzilla #274136)
            echo "===> Applying py-tyro patch (Bugzilla #274136)..."
            curl -sSL "https://bugs.freebsd.org/bugzilla/attachment.cgi?id=274136" -o /tmp/py-tyro.patch
            (cd /usr/ports && patch -p1 < /tmp/py-tyro.patch)

            # 3. Inject local ports from misc/ into /usr/ports/misc/
            echo "===> Injecting local ports into /usr/ports/misc/..."
            rm -rf /usr/ports/misc/prime-agent /usr/ports/misc/py-prime-agent-runtime
            cp -R misc/py-prime-agent-runtime /usr/ports/misc/
            cp -R misc/prime-agent /usr/ports/misc/

            # 4. Detect system default Python and Node versions dynamically from ports
            PY_PKGPREFIX=$(make -C /usr/ports/misc/prime-agent -V PYTHON_PKGNAMEPREFIX)
            NODE_VER=$(make -C /usr/ports/misc/prime-agent -V NODEJS_DEFAULT)
            echo "===> Detected Ports Python prefix: ${PY_PKGPREFIX}"
            echo "===> Detected Ports Node.js default: ${NODE_VER}"

            # 5. Dynamically pre-install binary packages matching the active Python flavor & toolchain
            echo "===> Pre-installing binary packages for flavor: ${PY_PKGPREFIX}..."
            pkg install -y \
              rust \
              uv \
              ${PY_PKGPREFIX}setuptools \
              ${PY_PKGPREFIX}wheel \
              ${PY_PKGPREFIX}build \
              ${PY_PKGPREFIX}installer \
              ${PY_PKGPREFIX}pyproject-hooks \
              ${PY_PKGPREFIX}flit-core \
              ${PY_PKGPREFIX}poetry-core \
              ${PY_PKGPREFIX}jinja2 \
              ${PY_PKGPREFIX}markupsafe \
              ${PY_PKGPREFIX}mcp \
              ${PY_PKGPREFIX}uv-dynamic-versioning \
              ${PY_PKGPREFIX}dunamai \
              ${PY_PKGPREFIX}babel \
              ${PY_PKGPREFIX}tomlkit \
              ${PY_PKGPREFIX}hatchling \
              ${PY_PKGPREFIX}docstring_parser \
              ${PY_PKGPREFIX}typeguard \
              ${PY_PKGPREFIX}typing-extensions \
              ${PY_PKGPREFIX}ipykernel \
              ${PY_PKGPREFIX}nest-asyncio2 \
              ${PY_PKGPREFIX}dill \
              ${PY_PKGPREFIX}lxml \
              ${PY_PKGPREFIX}pydantic2 \
              ${PY_PKGPREFIX}pyyaml \
              ${PY_PKGPREFIX}pillow \
              ${PY_PKGPREFIX}pyzmq \
              ${PY_PKGPREFIX}tomli \
              ${PY_PKGPREFIX}beautifulsoup \
              ${PY_PKGPREFIX}httpx \
              ${PY_PKGPREFIX}python-dotenv \
              ${PY_PKGPREFIX}requests || true

            # 6. Create output directory for artifacts
            mkdir -p dist-packages

            # 7. Build prerequisite port: devel/py-tyro (built and installed first)
            echo "===> [1/3] Building and installing devel/py-tyro..."
            make -C /usr/ports/devel/py-tyro BATCH=yes WITHOUT="DOCS EXAMPLES TEST" package install

            # 8. Build runtime shim port: misc/py-prime-agent-runtime
            echo "===> [2/3] Building and installing misc/py-prime-agent-runtime..."
            make -C /usr/ports/misc/py-prime-agent-runtime BATCH=yes WITHOUT="DOCS EXAMPLES TEST" package install

            # 9. Build main port: misc/prime-agent
            echo "===> [3/3] Building and packaging misc/prime-agent..."
            make -C /usr/ports/misc/prime-agent BATCH=yes WITHOUT="DOCS EXAMPLES TEST" package

            # 10. Collect all generated .pkg files
            echo "===> Collecting generated .pkg files..."
            find /usr/ports/packages/All /usr/ports/devel/py-tyro/work/pkg /usr/ports/misc/py-prime-agent-runtime/work/pkg /usr/ports/misc/prime-agent/work/pkg -name "*.pkg" -exec cp -v {} dist-packages/ \; 2>/dev/null || true

            # 11. Package port definitions into tarballs
            echo "===> Generating port source tarballs..."
            tar -czf dist-packages/prime-agent-freebsd-ports-${{ matrix.release }}-${{ matrix.arch }}.tar.gz misc/
            tar -czf dist-packages/devel-py-tyro-port-${{ matrix.release }}-${{ matrix.arch }}.tar.gz -C /usr/ports/devel py-tyro

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-${{ matrix.release }}-${{ matrix.arch }}-packages
          path: dist-packages/*
          if-no-files-found: warn

  publish-release:
    name: Publish Release Assets
    needs: build-freebsd
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          path: all-packages/

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-packages/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
